name: Spring PetClinic CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean package -DskipTests

  build-docker-image:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spring-petclinic:latest
          outputs: type=docker,dest=/tmp/spring-petclinic.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp/spring-petclinic.tar

  trivy-scan:
    needs: build-docker-image
    runs-on: self-hosted
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/spring-petclinic.tar

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'spring-petclinic:latest'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  push-to-nexus:
    needs: trivy-scan
    runs-on: self-hosted
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/spring-petclinic.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus Repository
        uses: docker/login-action@v3
        with:
          registry: 127.0.0.1:8082
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Push Docker Image to Nexus
        run: |
          docker tag spring-petclinic:latest ${{ secrets.NEXUS_REGISTRY_URL }}/spring-petclinic:${{ github.sha }}
          docker push ${{ secrets.NEXUS_REGISTRY_URL }}/spring-petclinic:${{ github.sha }}