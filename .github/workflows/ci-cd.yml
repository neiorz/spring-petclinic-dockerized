name: Spring PetClinic CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean package -DskipTests

  build-docker-image:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spring-petclinic:latest
          outputs: type=docker,dest=/tmp/spring-petclinic.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp/spring-petclinic.tar

  trivy-scan:
    needs: build-docker-image
    runs-on: self-hosted
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/spring-petclinic.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          image-ref: 'spring-petclinic:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  push-to-dockerhub:
    needs: trivy-scan
    runs-on: self-hosted
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/spring-petclinic.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker tag spring-petclinic:latest ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:${{ github.sha }}
          docker tag spring-petclinic:latest ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:latest