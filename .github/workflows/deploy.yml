#############################################################
# Spring PetClinic - Full CI/CD Pipeline (7 stages)
#
# 1) Build & Test (Maven)
# 2) SonarQube Analysis            -> WARNING ONLY, never fails the run
# 3) Trivy Vulnerability Scan      -> WARNING ONLY, never fails the run
# 4) Build & Push to Nexus
# 5) Deploy Locally via Docker Compose
# 6) Monitoring Setup (Prometheus + Grafana)
# 7) Automated Smoke Tests         -> this one CAN fail the run
#
# Runs on a SELF-HOSTED runner so it can talk to the local
# Docker daemon, local Nexus and local SonarQube.
#############################################################

name: PetClinic CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # manual trigger from the Actions tab

# Never let two runs of the same branch stomp on each other's containers.
concurrency:
  group: petclinic-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  # --- Image naming -------------------------------------------------
  IMAGE_NAME: spring-petclinic
  LOCAL_IMAGE: spring-petclinic:latest

  # --- Nexus Docker *Hosted* repository ------------------------------
  # NEXUS_DOCKER_REGISTRY = <host>:<HTTP connector port> of the Docker repo
  # NEXUS_DOCKER_REPO     = the Repository ID you created in Nexus
  # CHANGE THESE if your Nexus connector port / repo id is different.
  NEXUS_DOCKER_REGISTRY: localhost:8082
  NEXUS_DOCKER_REPO: docker_hosted

  # --- Local deployment ---------------------------------------------
  APP_URL: http://localhost:8080
  PROMETHEUS_URL: http://localhost:9090
  GRAFANA_URL: http://localhost:3000

jobs:
  # =================================================================
  # STAGE 1 - BUILD & TEST
  # =================================================================
  build-and-test:
    name: "1 | Build & Test"
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Maven clean package + run tests
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Build Docker image (always - this is the image the pipeline ships)
        run: |
          # The later jobs only build "if the image is missing". That is fine for the
          # first run, but on the next push the image from the PREVIOUS commit still
          # exists, so the pipeline would tag, push and deploy stale code.
          # Build it here, once, from this exact checkout.
          docker build -t "$LOCAL_IMAGE" .
          docker image inspect "$LOCAL_IMAGE" --format 'Built {{index .RepoTags 0}} = {{.Id}}'

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: petclinic-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 3

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: petclinic-test-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 3

  # =================================================================
  # STAGE 2 - SONARQUBE ANALYSIS  (NON-BLOCKING)
  # =================================================================
  sonarqube-analysis:
    name: "2 | SonarQube Analysis (warn only)"
    needs: build-and-test
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # SonarQube blame / new-code detection needs full history

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Compile so the scanner has target/classes (sonar.java.binaries).
      - name: Compile classes for analysis
        run: ./mvnw -B --no-transfer-progress -DskipTests compile

      - name: SonarQube credentials configured?
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=SonarQube skipped::SONAR_HOST_URL / SONAR_TOKEN secrets are not configured. Stage skipped, pipeline continues."
            echo "SKIPPED=true" >> "$GITHUB_ENV"
          else
            echo "SKIPPED=false" >> "$GITHUB_ENV"
          fi

      - name: Run SonarQube scan
        id: sonar
        if: env.SKIPPED == 'false'
        continue-on-error: true          # <-- quality gate / bugs never fail the build
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=spring-petclinic
            -Dsonar.projectName=Spring PetClinic
            -Dsonar.java.binaries=target/classes
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Report SonarQube result
        if: env.SKIPPED == 'false'
        env:
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
        run: |
          {
            echo "## 2) SonarQube Analysis (non-blocking)"
            echo "Project key: \`spring-petclinic\` @ ${SONAR_HOST_URL}"
            echo "Step outcome: \`${SONAR_OUTCOME}\`"
            echo ""
            echo "> Findings are **advisory only** - the pipeline continues to the Trivy stage either way."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SONAR_OUTCOME" = "success" ]; then
            echo "::notice title=SonarQube::Analysis finished successfully."
          else
            echo "::warning title=SonarQube::Analysis failed (bad token/host, or issues found). Reported as a warning only - the pipeline continues."
          fi

  # =================================================================
  # STAGE 3 - TRIVY VULNERABILITY SCAN  (NON-BLOCKING)
  #   * filesystem scan of the app source/dependencies
  #   * container image scan
  #   exit-code is always 0, plus continue-on-error for action failures
  # =================================================================
  trivy-scan:
    name: "3 | Trivy Scan (warn only)"
    needs: sonarqube-analysis
    runs-on: self-hosted
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image if it is not on the local daemon
        run: |
          if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
            echo "Local image missing, building it..."
            docker build -t "$LOCAL_IMAGE" .
          fi
          docker image inspect "$LOCAL_IMAGE" --format 'Image: {{.RepoTags}} ({{.Id}})'

      # ---------- 3a) source / dependency scan ----------
      - name: Trivy - filesystem (dependency) scan
        continue-on-error: true           # <-- never fails the pipeline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'                # no secret scan -> much faster
          timeout: '30m'                  # default 5m dies with "context deadline exceeded"
          cache: 'false'                  # NEVER upload the ~1GB DB to GitHub cache (stalls forever)
          cache-dir: '/home/nourz/.cache/trivy'   # keep the DB on the runner, outside the repo

      # ---------- 3b) container image scan ----------
      - name: Trivy - container image scan
        continue-on-error: true           # <-- never fails the pipeline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'spring-petclinic:latest'
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'                # no secret scan -> much faster
          timeout: '30m'                  # default 5m dies with "context deadline exceeded"
          cache: 'false'                  # NEVER upload the ~1GB DB to GitHub cache (stalls forever)
          cache-dir: '/home/nourz/.cache/trivy'   # keep the DB on the runner, outside the repo

      - name: Publish security summary (warnings only)
        if: always()
        run: |
          {
            echo "## 3) Trivy Vulnerability Scan (non-blocking)"
            echo "> Findings below are **warnings only**. The pipeline continues to the Nexus push stage."
            echo ""
            if [ -f trivy-image-report.txt ]; then
              echo "### Container image \`$LOCAL_IMAGE\`"
              echo '```'
              cat trivy-image-report.txt
              echo '```'
            fi
            if [ -f trivy-fs-report.txt ]; then
              echo "### Filesystem / dependencies"
              echo '```'
              cat trivy-fs-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Surface them as real annotations in the PR / run page
          if [ ! -f trivy-image-report.txt ] && [ ! -f trivy-fs-report.txt ]; then
            echo "::warning title=Trivy::Scan produced no report (action may have failed, e.g. network). Pipeline continues."
          fi
          if [ -f trivy-image-report.txt ]; then
            CRIT=$(grep -cE 'CRITICAL' trivy-image-report.txt || true)
            HIGH=$(grep -cE 'HIGH' trivy-image-report.txt || true)
            if [ "${CRIT:-0}" -gt 0 ] || [ "${HIGH:-0}" -gt 0 ]; then
              echo "::warning title=Trivy::Found $CRIT CRITICAL / $HIGH HIGH matches. See the job summary - pipeline continues."
            fi
          fi

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: trivy-*.txt
          if-no-files-found: ignore
          retention-days: 7

  # =================================================================
  # STAGE 4 - BUILD & PUSH TO NEXUS
  # =================================================================
  nexus-push:
    name: "4 | Build & Push to Nexus"
    needs: trivy-scan
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve target image references
        run: |
          REGISTRY_IMAGE="${NEXUS_DOCKER_REGISTRY}/${NEXUS_DOCKER_REPO}/${IMAGE_NAME}"
          echo "REGISTRY_IMAGE=$REGISTRY_IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${REGISTRY_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY_IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Build image if it is not on the local daemon
        run: |
          if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
            docker build -t "$LOCAL_IMAGE" .
          fi

      - name: Verify Nexus is reachable (fail fast with a clear message)
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "$NEXUS_USER" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::error title=Missing secrets::NEXUS_USER / NEXUS_PASSWORD are not configured in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                 -u "$NEXUS_USER:$NEXUS_PASSWORD" \
                 "http://${NEXUS_DOCKER_REGISTRY}/v2/" || echo 000)
          echo "GET http://${NEXUS_DOCKER_REGISTRY}/v2/ -> HTTP $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "401" ]; then
            echo "::error title=Nexus unreachable::Cannot reach the Docker registry at ${NEXUS_DOCKER_REGISTRY}."
            echo "::error::Make sure Nexus is running (docker compose up -d nexus), that repository '${NEXUS_DOCKER_REPO}' has HTTP connector port 8082, and that 8082 is published in docker-compose.yml."
            exit 1
          fi

      - name: Log in to Nexus Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.NEXUS_DOCKER_REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Tag and push to Nexus
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_SHA"
          docker tag "$LOCAL_IMAGE" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "Pushed: $IMAGE_SHA"
          echo "Pushed: $IMAGE_LATEST"

  # =================================================================
  # STAGE 5 - DEPLOY LOCALLY VIA DOCKER COMPOSE
  # =================================================================
  deploy-local:
    name: "5 | Deploy via Docker Compose"
    needs: nexus-push
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image if it is not on the local daemon
        run: |
          if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
            docker build -t "$LOCAL_IMAGE" .
          fi

      - name: Resolve image to deploy (prefer what was pushed to Nexus)
        run: |
          REGISTRY_IMAGE="${NEXUS_DOCKER_REGISTRY}/${NEXUS_DOCKER_REPO}/${IMAGE_NAME}"
          echo "APP_IMAGE=${REGISTRY_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Start the stack (app + database)
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -e
          # --- release globally-pinned container names -------------------------
          # docker-compose.yml pins container_name: petclinic-app / petclinic-mysql.
          # Those names are GLOBAL, so if a stack was started by hand from another
          # directory (=> a different compose project) `docker compose up` dies with
          #   Conflict. The container name "/petclinic-mysql" is already in use
          # Remove leftovers that belong to another project. Named volumes
          # (mysql_data, ...) are project-scoped and untouched - no data is lost.
          PROJECT="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
          for c in petclinic-app petclinic-mysql; do
            if docker container inspect "$c" >/dev/null 2>&1; then
              p="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c" 2>/dev/null || echo unknown)"
              if [ "$p" != "$PROJECT" ]; then
                echo "Removing leftover container $c (compose project '$p' != '$PROJECT')"
                docker rm -f "$c" >/dev/null
              fi
            fi
          done

          # Safety net: keep the local tag usable even if the Nexus pull fails.
          docker tag "$LOCAL_IMAGE" "$APP_IMAGE" 2>/dev/null || true

          # docker/login-action in stage 4 uses a temporary DOCKER_CONFIG, so its
          # credentials do NOT survive into this job. Log in again here, otherwise
          # `compose pull` gets "no basic auth credentials" and always falls back
          # to the local image. Never fatal: the local tag is an exact copy of the
          # image that was pushed to Nexus (same build, same commit SHA).
          echo "::group::Login to Nexus"
          if [ -n "$NEXUS_USER" ] && [ -n "$NEXUS_PASSWORD" ]; then
            if echo "$NEXUS_PASSWORD" | docker login "$NEXUS_DOCKER_REGISTRY" \
                 -u "$NEXUS_USER" --password-stdin 2>/dev/null; then
              echo "Logged in to $NEXUS_DOCKER_REGISTRY"
            else
              echo "::warning title=Nexus login::Login to $NEXUS_DOCKER_REGISTRY failed - deploying the locally built image."
            fi
          else
            echo "::warning title=Nexus login::NEXUS_USER / NEXUS_PASSWORD are not set - deploying the locally built image."
          fi
          echo "::endgroup::"

          echo "::group::Pulling application image from Nexus"
          docker compose pull app || \
            echo "::warning title=Nexus pull failed::Could not pull $APP_IMAGE from Nexus - falling back to the locally built image."
          echo "::endgroup::"

          echo "::group::docker compose up"
          docker compose up -d --no-build app mysql
          echo "::endgroup::"

          docker compose ps
          docker compose logs --no-log-prefix app | tail -50

      - name: Wait for the application to become ready
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$APP_URL/actuator/health" >/dev/null 2>&1; then
              echo "Application is up after ${i}x3s."
              curl -fsS "$APP_URL/actuator/health"; echo
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 3
          done
          echo "::error::Application did not become healthy in 120s"
          docker compose logs --no-log-prefix app | tail -100
          exit 1

  # =================================================================
  # STAGE 6 - MONITORING SETUP (PROMETHEUS + GRAFANA)
  # =================================================================
  monitoring:
    name: "6 | Monitoring Setup"
    needs: deploy-local
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image to deploy (same value as stage 5)
        run: |
          # $GITHUB_ENV does NOT cross job boundaries, so APP_IMAGE set in stage 5
          # is empty here. Without it compose resolves app to spring-petclinic:latest,
          # which RECREATES petclinic-app (restarting it) - or, if that tag is missing
          # locally, tries to pull it from Docker Hub and fails.
          REGISTRY_IMAGE="${NEXUS_DOCKER_REGISTRY}/${NEXUS_DOCKER_REPO}/${IMAGE_NAME}"
          echo "APP_IMAGE=${REGISTRY_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

          if ! docker image inspect "${REGISTRY_IMAGE}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image ${REGISTRY_IMAGE}:${GITHUB_SHA} not on the daemon - retagging from ${LOCAL_IMAGE}"
            if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
              docker build -t "$LOCAL_IMAGE" .
            fi
            docker tag "$LOCAL_IMAGE" "${REGISTRY_IMAGE}:${GITHUB_SHA}"
          fi
          docker image inspect "${REGISTRY_IMAGE}:${GITHUB_SHA}" --format 'Deploying: {{.RepoTags}}'

      - name: Start Prometheus + Grafana
        run: |
          # Same global container_name clash as stage 5: petclinic-prometheus /
          # petclinic-grafana may still exist from a hand-started stack.
          PROJECT="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
          for c in petclinic-prometheus petclinic-grafana; do
            if docker container inspect "$c" >/dev/null 2>&1; then
              p="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c" 2>/dev/null || echo unknown)"
              if [ "$p" != "$PROJECT" ]; then
                echo "Removing leftover container $c (compose project '$p' != '$PROJECT')"
                docker rm -f "$c" >/dev/null
              fi
            fi
          done
          docker compose up -d prometheus grafana
          docker compose ps

      - name: Wait for Prometheus and verify the app target is scraped
        run: |
          echo "Waiting for Prometheus..."
          for i in $(seq 1 30); do
            curl -fsS "$PROMETHEUS_URL/-/ready" >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS "$PROMETHEUS_URL/-/ready" >/dev/null || {
            echo "::error::Prometheus is not ready"; exit 1; }

          echo "Waiting for the spring-petclinic scrape target..."
          UP=false
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS "$PROMETHEUS_URL/api/v1/targets" \
              | jq -r '.data.activeTargets[]? | select(.labels.job=="spring-petclinic") | .health')
            if [ "$HEALTH" = "up" ]; then UP=true; break; fi
            sleep 3
          done

          if [ "$UP" = "true" ]; then
            echo "Prometheus target spring-petclinic is UP."
          else
            echo "::warning title=Monitoring::Prometheus is running but the spring-petclinic target is not UP yet (job health: ${HEALTH:-unknown})."
          fi

      - name: Verify Grafana
        run: |
          for i in $(seq 1 20); do
            curl -fsS "$GRAFANA_URL/api/health" >/dev/null 2>&1 && break
            sleep 3
          done
          echo "Grafana health:"; curl -fsS "$GRAFANA_URL/api/health"; echo
          echo "Datasources provisioned:"
          curl -fsS -u admin:admin "$GRAFANA_URL/api/datasources" | jq -r '.[] | "\(.uid) \(.type) \(.name)"'

  # =================================================================
  # STAGE 7 - AUTOMATED SMOKE TESTS  (BLOCKING - a real failure here
  #           means the deployment is broken)
  # =================================================================
  smoke-tests:
    name: "7 | Smoke Tests"
    needs: monitoring
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "::group::compose ps"; docker compose ps; echo "::endgroup::"
          echo "::group::app logs"; docker compose logs --no-log-prefix app | tail -200; echo "::endgroup::"
          echo "::group::prometheus logs"; docker compose logs --no-log-prefix prometheus | tail -50; echo "::endgroup::"
