apiVersion: 1

# Auto-provisions the Prometheus datasource, so Grafana is usable
# right after `docker compose up -d grafana` - no manual setup.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
