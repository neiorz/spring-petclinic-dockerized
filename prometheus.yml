global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring PetClinic - exposed by spring-boot-starter-actuator +
  # io.micrometer:micrometer-registry-prometheus at /actuator/prometheus
  - job_name: 'spring-petclinic'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          env: 'local'
          app: 'spring-petclinic'

  # Prometheus itself (useful for the "is my monitor healthy?" dashboard)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
